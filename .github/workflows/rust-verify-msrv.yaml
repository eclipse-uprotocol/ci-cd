# Checks if the Minimum Supported Rust Version (MSRV) declared in a Rust project's
# Cargo.toml is correct, i.e. if the project can be compiled using a Rust toolchain
# of that version.

name: Check MSRV

on:
  workflow_call:
    inputs:
      rust_toolchain:
        type: string
        description: 'Rust toolchain to use for running the checks. If not set, the stable toolchain will be used.'
        required: false

env:
  RUST_TOOLCHAIN: ${{ inputs.rust_toolchain || 'stable' }}
  RUSTFLAGS: -Dwarnings
  CARGO_TERM_COLOR: always

permissions:
  contents: read # needed for checking out the code

jobs:
  check:
    name: Check crate's MSRV
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: "recursive"
    - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with: 
        toolchain: ${{ env.RUST_TOOLCHAIN }}
    - name: Install cargo-hack
      run: |
        cargo install cargo-hack --locked
    - name: check MSRV
      run: |
        cargo hack check --rust-version --workspace --all-targets --all-features --ignore-private
